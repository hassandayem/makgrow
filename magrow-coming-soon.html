<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGROW Real Estate — Coming Soon</title>
<meta name="description" content="MAGROW Real Estate. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #031a36;
    --navy-800: #04234a;
    --blue-600: #0b4a8a;
    --white: #ffffff;
    --white-soft: rgba(255, 255, 255, 0.78);
    --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --photo: url("https://images.unsplash.com/photo-1792483321751-82fa5450da83?fm=jpg&q=75&w=2400&auto=format&fit=crop&ixlib=rb-4.1.0");
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background-color: var(--navy-800);
    color: var(--white);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 2rem 1rem;
    overflow: hidden;
    isolation: isolate;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background: var(--photo) center / cover no-repeat;
    transform: scale(1.06);
    animation: settle 2.4s cubic-bezier(.2, .7, .2, 1) forwards;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(3, 26, 54, 0.55) 0%, rgba(4, 35, 74, 0.72) 55%, rgba(3, 26, 54, 0.92) 100%),
      linear-gradient(90deg, rgba(11, 74, 138, 0.45) 0%, rgba(11, 74, 138, 0) 70%);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    font-weight: 400;
    line-height: 1;
    opacity: 0;
    animation: rise 1.4s cubic-bezier(.2, .7, .2, 1) .3s forwards;
  }

  .logo__word {
    font-size: clamp(3rem, 12vw, 7.5rem);
    font-weight: 300;
    letter-spacing: 0.01em;
  }

  .logo__word b { font-weight: 700; }

  .logo__rule {
    display: block;
    width: 62%;
    height: 1px;
    margin-top: clamp(0.6rem, 1.6vw, 1rem);
    background: var(--white);
  }

  .logo__tag {
    margin-top: clamp(0.5rem, 1.3vw, 0.85rem);
    font-size: clamp(0.8rem, 2.5vw, 1.55rem);
    font-weight: 400;
    letter-spacing: 0.16em;
    padding-left: 0.16em;
  }

  .soon {
    margin: clamp(3rem, 8vw, 5.5rem) 0 0;
    font-size: clamp(0.72rem, 1.6vw, 0.9rem);
    font-weight: 500;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    text-transform: uppercase;
    color: var(--white-soft);
    opacity: 0;
    animation: rise 1.4s cubic-bezier(.2, .7, .2, 1) .9s forwards;
  }

  @keyframes settle { to { transform: scale(1); } }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage::before { animation: none; transform: none; }
    .logo, .soon { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="brand">
      <h1 class="logo" aria-label="MAGROW Real Estate">
        <span class="logo__word" aria-hidden="true">MA<b>G</b>ROW</span>
        <span class="logo__rule" aria-hidden="true"></span>
        <span class="logo__tag" aria-hidden="true">REAL ESTATE</span>
      </h1>
      <p class="soon">Coming Soon</p>
    </div>
  </main>
</body>
</html>
